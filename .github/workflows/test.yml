name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # gitleaks-action requires a paid license for organization accounts
  # (Energee-AS is an org). Disabled in this fork; secret scanning is
  # covered by GitHub's built-in push protection and the upstream
  # garrytan/gbrain CI (where the action runs free under a personal account).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test
